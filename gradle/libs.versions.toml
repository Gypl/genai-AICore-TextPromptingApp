[versions]
agp = "9.4.0"
kotlin = "2.3.21"
ksp = "2.3.11"
compose-bom = "2026.08.00"
hilt = "2.60.1"
hilt-navigation-compose = "1.3.0"
lifecycle = "2.9.0"
coroutines = "1.11.0"
mlkit-genai = "1.0.0-beta4"
